aid: arbolmarkets

name: Arbolmarkets

description: Arbolmarkets is a financial technology company that provides a marketplace for secondary trading of private company equity. It enables
  investors to buy and sell shares in private firms, offering liquidity solutions and a platform for price discovery. The service targets accredited
  investors and companies seeking to manage their cap tables, facilitating secondary market transactions with compliance and reporting tools.
  Arbolmarkets aims to democratize access to private market investments while ensuring regulatory adherence and transparent trade execution.

